<!-- Standalone Carousel Component - Paste this into an Elementor HTML block -->
<style>
  .ara-carousel-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  }

  .ara-carousel {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: #1a1a2e;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  }

  .ara-carousel-slides {
    display: flex;
    transition: transform 0.5s ease-in-out;
  }

  .ara-carousel-slide {
    min-width: 100%;
    position: relative;
    aspect-ratio: 16 / 9;
  }

  .ara-carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .ara-carousel-slide-title {
    position: absolute;
    bottom: 40px;
    left: 30px;
    color: white;
    font-size: 28px;
    font-weight: 600;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    margin: 0;
  }

  /* Navigation Arrows */
  .ara-carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    background: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    z-index: 10;
  }

  .ara-carousel-arrow:hover {
    transform: translateY(-50%) scale(1.05);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  }

  .ara-carousel-arrow:active {
    transform: translateY(-50%) scale(0.95);
  }

  .ara-carousel-arrow-prev {
    left: 16px;
  }

  .ara-carousel-arrow-next {
    right: 16px;
  }

  .ara-carousel-arrow::before {
    content: '';
    width: 12px;
    height: 12px;
    border-right: 3px solid #1a1a2e;
    border-bottom: 3px solid #1a1a2e;
    display: block;
  }

  .ara-carousel-arrow-prev::before {
    transform: rotate(135deg);
    margin-left: 4px;
  }

  .ara-carousel-arrow-next::before {
    transform: rotate(-45deg);
    margin-right: 4px;
  }

  /* Dot Indicators */
  .ara-carousel-dots {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
    z-index: 10;
  }

  .ara-carousel-dot {
    width: 8px;
    height: 8px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.5);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: all 0.3s ease;
  }

  .ara-carousel-dot:hover {
    background: rgba(255, 255, 255, 0.8);
  }

  .ara-carousel-dot.active {
    width: 24px;
    background: white;
  }

  /* Auto-play indicator (optional) */
  .ara-carousel-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.8);
    width: 0%;
    transition: width 0.1s linear;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .ara-carousel-slide-title {
      font-size: 20px;
      bottom: 30px;
      left: 20px;
    }

    .ara-carousel-arrow {
      width: 40px;
      height: 40px;
    }

    .ara-carousel-arrow::before {
      width: 10px;
      height: 10px;
      border-width: 2px;
    }

    .ara-carousel-arrow-prev {
      left: 10px;
    }

    .ara-carousel-arrow-next {
      right: 10px;
    }
  }
</style>

<div class="ara-carousel-container">
  <div class="ara-carousel" id="araCarousel">
    <div class="ara-carousel-slides" id="araCarouselSlides">
      <!-- Slide 1 -->
      <div class="ara-carousel-slide">
        <img src="https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1200&q=80" alt="Mountain Peaks">
        <h3 class="ara-carousel-slide-title">Mountain Peaks</h3>
      </div>
      <!-- Slide 2 -->
      <div class="ara-carousel-slide">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80" alt="Ocean Waves">
        <h3 class="ara-carousel-slide-title">Ocean Waves</h3>
      </div>
      <!-- Slide 3 -->
      <div class="ara-carousel-slide">
        <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200&q=80" alt="Forest Path">
        <h3 class="ara-carousel-slide-title">Forest Path</h3>
      </div>
      <!-- Slide 4 -->
      <div class="ara-carousel-slide">
        <img src="https://images.unsplash.com/photo-1473580044384-7ba9967e16a0?w=1200&q=80" alt="Desert Dunes">
        <h3 class="ara-carousel-slide-title">Desert Dunes</h3>
      </div>
    </div>

    <!-- Navigation Arrows -->
    <button class="ara-carousel-arrow ara-carousel-arrow-prev" id="araPrev" aria-label="Previous slide"></button>
    <button class="ara-carousel-arrow ara-carousel-arrow-next" id="araNext" aria-label="Next slide"></button>

    <!-- Dot Indicators -->
    <div class="ara-carousel-dots" id="araCarouselDots"></div>

    <!-- Progress Bar (for auto-play) -->
    <div class="ara-carousel-progress" id="araProgress"></div>
  </div>
</div>

<script>
(function() {
  // Carousel Configuration
  const config = {
    autoPlay: true,
    autoPlayInterval: 5000, // 5 seconds
    pauseOnHover: true
  };

  // Elements
  const carousel = document.getElementById('araCarousel');
  const slidesContainer = document.getElementById('araCarouselSlides');
  const slides = slidesContainer.querySelectorAll('.ara-carousel-slide');
  const prevBtn = document.getElementById('araPrev');
  const nextBtn = document.getElementById('araNext');
  const dotsContainer = document.getElementById('araCarouselDots');
  const progressBar = document.getElementById('araProgress');

  // State
  let currentIndex = 0;
  let autoPlayTimer = null;
  let progressTimer = null;
  let progressValue = 0;
  const totalSlides = slides.length;

  // Create dot indicators
  function createDots() {
    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('button');
      dot.className = 'ara-carousel-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
      dot.addEventListener('click', () => goToSlide(i));
      dotsContainer.appendChild(dot);
    }
  }

  // Update dots
  function updateDots() {
    const dots = dotsContainer.querySelectorAll('.ara-carousel-dot');
    dots.forEach((dot, index) => {
      dot.classList.toggle('active', index === currentIndex);
    });
  }

  // Go to specific slide
  function goToSlide(index) {
    currentIndex = index;
    if (currentIndex >= totalSlides) currentIndex = 0;
    if (currentIndex < 0) currentIndex = totalSlides - 1;

    slidesContainer.style.transform = 'translateX(-' + (currentIndex * 100) + '%)';
    updateDots();
    resetProgress();
  }

  // Next slide
  function nextSlide() {
    goToSlide(currentIndex + 1);
  }

  // Previous slide
  function prevSlide() {
    goToSlide(currentIndex - 1);
  }

  // Auto-play functions
  function startAutoPlay() {
    if (!config.autoPlay) return;
    stopAutoPlay();
    autoPlayTimer = setInterval(nextSlide, config.autoPlayInterval);
    startProgress();
  }

  function stopAutoPlay() {
    if (autoPlayTimer) {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
    }
    stopProgress();
  }

  // Progress bar
  function startProgress() {
    if (!config.autoPlay) return;
    progressValue = 0;
    progressBar.style.width = '0%';
    progressTimer = setInterval(() => {
      progressValue += 100 / (config.autoPlayInterval / 50);
      progressBar.style.width = Math.min(progressValue, 100) + '%';
    }, 50);
  }

  function stopProgress() {
    if (progressTimer) {
      clearInterval(progressTimer);
      progressTimer = null;
    }
  }

  function resetProgress() {
    stopProgress();
    if (config.autoPlay && autoPlayTimer) {
      startProgress();
    }
  }

  // Touch/Swipe support
  let touchStartX = 0;
  let touchEndX = 0;

  function handleTouchStart(e) {
    touchStartX = e.changedTouches[0].screenX;
  }

  function handleTouchEnd(e) {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }

  function handleSwipe() {
    const swipeThreshold = 50;
    const diff = touchStartX - touchEndX;

    if (Math.abs(diff) > swipeThreshold) {
      if (diff > 0) {
        nextSlide();
      } else {
        prevSlide();
      }
    }
  }

  // Keyboard navigation
  function handleKeydown(e) {
    if (e.key === 'ArrowLeft') {
      prevSlide();
    } else if (e.key === 'ArrowRight') {
      nextSlide();
    }
  }

  // Event listeners
  prevBtn.addEventListener('click', prevSlide);
  nextBtn.addEventListener('click', nextSlide);

  carousel.addEventListener('touchstart', handleTouchStart, { passive: true });
  carousel.addEventListener('touchend', handleTouchEnd, { passive: true });

  if (config.pauseOnHover) {
    carousel.addEventListener('mouseenter', stopAutoPlay);
    carousel.addEventListener('mouseleave', startAutoPlay);
  }

  carousel.addEventListener('keydown', handleKeydown);
  carousel.setAttribute('tabindex', '0');

  // Initialize
  createDots();
  startAutoPlay();
})();
</script>
